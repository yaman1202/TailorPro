name: TailorPro CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Tests, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run Firestore Rules and repository emulator tests
        run: npm run test:firestore-rules

      - name: Run Storage Rules emulator tests
        run: npm run test:storage-rules

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
